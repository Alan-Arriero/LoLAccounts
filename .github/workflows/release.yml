name: Build and publish Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Build app
        shell: pwsh
        run: |
          # PyInstaller may otherwise collect unrelated ICU DLLs from Poppler in the runner PATH.
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notmatch '(?i)\\poppler\\Library\\bin' }) -join ';'
          poetry run pyinstaller --noconfirm --clean --windowed --onedir --name "Rift Vault" --icon logo.ico --add-data "image.png;." --add-data "static;static" --add-data "riot_renderer.js;." --collect-all keyring --collect-all psutil --collect-all websocket --collect-all tzdata main.py
          Copy-Item README.md "dist/Rift Vault/README.txt"
          Copy-Item THIRD_PARTY_NOTICES.md "dist/Rift Vault/THIRD_PARTY_NOTICES.txt"
          Copy-Item .env.example "dist/Rift Vault/.env.example"
          Compress-Archive -Path "dist/Rift Vault" -DestinationPath dist/LoLAccounts-windows-x64.zip -Force
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/LoLAccounts-windows-x64.zip
