[tool.poetry]
name = "rift-vault"
version = "0.2.8"
description = "Neon League of Legends account manager for EUW"
authors = ["Rift Vault"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
httpx = "^0.27.0"
python-dotenv = "^1.0.1"
keyring = "^25.7.0"
pyinstaller = "^6.22.3"
pyside6 = "^6.12.0"
pyside6-webengine = "^6.12.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"



